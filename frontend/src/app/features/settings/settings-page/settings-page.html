<section class="settings-page">
  <h1>Settings</h1>

  @if (settings(); as s) {
    <div class="panel">
      <h2>Backups</h2>
      <p class="muted">
        Creates a copy of the database once per day as a safety net against accidental data
        loss. Stored in the <code>backups/</code> folder next to the database.
      </p>
      <label>
        <input type="checkbox" [checked]="s.auto_backup_enabled" (change)="toggleAutoBackup()" />
        Automatic daily backup
      </label>
    </div>
  } @else {
    <p class="muted">Loading…</p>
  }
</section>
