<section class="theme-list">
  <h1>Themes</h1>

  <form class="new-theme" [formGroup]="form" (ngSubmit)="submit()">
    <input type="text" formControlName="title" placeholder="New theme title" />
    <button type="submit" [disabled]="form.invalid || creating()">Add</button>
  </form>

  @if (loading()) {
    <p>Loading…</p>
  } @else if (themes().length === 0) {
    <p class="empty">No themes yet.</p>
  } @else {
    <ul>
      @for (theme of themes(); track theme.id) {
        <li>
          <a [routerLink]="['/themes', theme.id]">{{ theme.title }}</a>
        </li>
      }
    </ul>
  }
</section>
