name: Smoke CI

# Full-stack smoke test on every PR (required for merging) and on pushes to main: builds the
# frontend, installs the backend, embeds the built SPA into the backend's static dir, then runs
# scripts/smoke-test.sh against the real running app.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx ng build

      - name: Install backend deps and embed built UI
        run: |
          pip install -r backend/requirements.txt
          cp -r frontend/dist/pointify/browser backend/app/static

      - name: Smoke test
        run: bash scripts/smoke-test.sh backend
